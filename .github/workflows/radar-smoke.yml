name: FOODHUNT Radar browser smoke
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "v10.js"
      - "v16.css"
      - "tests/radar-smoke.mjs"
      - "tests/radar-live-probe.mjs"
      - ".github/workflows/radar-smoke.yml"
  workflow_dispatch:
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1 leaflet@1.9.4
      - run: npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/foodhunt-server.log 2>&1 &
          echo $! > /tmp/foodhunt-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test GPS, API failover and manual city search in Chromium
        run: node tests/radar-smoke.mjs
      - name: Probe public Overpass availability from browser (non-blocking)
        continue-on-error: true
        run: node tests/radar-live-probe.mjs
      - name: Attach screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodhunt-radar-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
